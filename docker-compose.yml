services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: parkwatch-backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    restart: unless-stopped
    networks:
      - parkwatch-net

  db:
    image: mysql:8.0
    container_name: parkwatch-db
    environment:
      MYSQL_DATABASE: ${DB_NAME:-parkwatch}
      MYSQL_USER: ${DB_USER:-parkwatch_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - parkwatch-net

volumes:
  mysql_data:

networks:
  parkwatch-net:
    driver: bridge
