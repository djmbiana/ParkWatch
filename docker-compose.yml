# docker-compose.yml — local development stack
#
# Before running: copy .env.example to .env at this directory level
# and fill in real values. docker-compose reads the root .env for
# ${VAR} substitution (db service), while the backend container
# reads ./backend/.env for its own runtime config.
#
# Start the core services:  docker-compose up
# Include the frontend:     docker-compose --profile frontend up

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: parkwatch-backend
    ports:
      - "3000:3000"
    environment:
      # Override the Dockerfile default (8080) so local dev runs on 3000.
      PORT: 3000
    env_file:
      - ./backend/.env
    # Use nodemon for hot-reload in development.
    command: npm run dev
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      # Preserve the image's node_modules; don't overwrite with host folder.
      # NOTE: this anonymous volume is populated from the image only when first
      # created, so it shadows dependency changes. After editing package.json,
      # rebuild AND renew the volume or the new deps won't appear at runtime:
      #   docker compose up -d --build --renew-anon-volumes backend
      # (a plain `down && up` keeps the stale volume — e.g. a missing node-cron).
      - /app/node_modules
    restart: unless-stopped
    networks:
      - parkwatch-net

  db:
    image: mysql:8.0
    container_name: parkwatch-db
    environment:
      MYSQL_DATABASE: ${DB_NAME:-parkwatch}
      MYSQL_USER: ${DB_USER:-parkwatch_user}
      # Fail fast if these aren't set — no weak fallback passwords (I.2).
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      # Root password is kept separate from the app-user password.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}
    ports:
      # Bind to localhost only — reachable by local DB tools (TablePlus/DBeaver)
      # but NOT exposed to other machines on the network (Check 4.13).
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Both files run automatically on first container start (alphabetical order).
      # 01 = DDL, 02 = reference/lookup data (barangays, streets, tiers).
      # For dev user accounts: docker-compose exec backend npm run seed
      - ./backend/src/config/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/src/config/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      # Ping without credentials — only checks server liveness.
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - parkwatch-net

  # React + Vite frontend — scaffolded in Sprint 2.
  # Run with: docker-compose --profile frontend up frontend
  frontend:
    image: node:20-alpine
    container_name: parkwatch-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: >
      sh -c "echo 'Frontend not yet scaffolded.
      Run: npm create vite@latest inside the frontend/ folder, then update this service.'"
    networks:
      - parkwatch-net
    profiles:
      - frontend

volumes:
  mysql_data:

networks:
  parkwatch-net:
    driver: bridge
